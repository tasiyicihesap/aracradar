name: ARAÇRADAR Otomatik Tarama
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - name: Tarama
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python scripts/tarama.py
      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "ARAÇRADAR Bot"
          git add data/
          git diff --staged --quiet || git commit -m "Otomatik tarama [$(date '+%H:%M')]"
          git push
