<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <!-- iOS -->
  <meta name="viewport_bak" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARAÇRADAR">
<link rel="apple-touch-icon" href="./icon192.svg">
<title>ARAÇRADAR — Araç Fiyat Takip</title>
<style>
:root {
  --bg: #0a0f1e;
  --bg2: #111827;
  --bg3: #1a2235;
  --kart: #151d2e;
  --brd: rgba(255,255,255,0.06);
  --brd2: rgba(255,255,255,0.12);
  --txt: #e2e8f0;
  --mut: #64748b;
  --mut2: #94a3b8;
  --blu: #3b82f6;
  --blu2: #1d4ed8;
  --grn: #10b981;
  --red: #ef4444;
  --ora: #f97316;
  --pur: #8b5cf6;
  --yel: #f59e0b;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--txt); font-family: var(--font); min-height: 100vh; }

/* ── HEADER ─────────────────────────────────────────────────────────────── */
.header {
  background: linear-gradient(135deg, #0d1b2e 0%, #0f172a 100%);
  border-bottom: 1px solid var(--brd);
  padding: 0 20px;
  height: 60px;
  display: flex;
  align-items: center;
  gap: 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-icon { font-size: 24px; }
.logo-text { font-size: 15px; font-weight: 800; color: var(--ora); letter-spacing: 0.08em; }
.logo-sub { font-size: 9px; color: var(--mut); text-transform: uppercase; letter-spacing: 0.1em; }
.header-stats { display: flex; gap: 16px; margin-left: 20px; }
.hstat { text-align: center; }
.hstat-v { font-size: 16px; font-weight: 700; line-height: 1; }
.hstat-v.green { color: var(--grn); }
.hstat-v.red { color: var(--red); }
.hstat-l { font-size: 9px; color: var(--mut); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
.header-divider { width: 1px; height: 30px; background: var(--brd2); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.hbtn {
  padding: 6px 12px; border: 1px solid var(--brd2); border-radius: 8px;
  background: rgba(255,255,255,0.04); color: var(--mut2);
  font-size: 12px; cursor: pointer; font-family: var(--font);
  transition: all 0.15s; white-space: nowrap;
}
.hbtn:hover { background: rgba(255,255,255,0.08); color: var(--txt); }
.hbtn.active { background: var(--blu); color: #fff; border-color: var(--blu); }
#btn-bildirim-web.on { color: var(--grn); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.08); }
#btn-bildirim-web.sesiz { color: var(--mut); }

/* ── SEKMELER ───────────────────────────────────────────────────────────── */
.sekmeler {
  display: flex; gap: 4px; padding: 12px 20px 0;
  border-bottom: 1px solid var(--brd);
  background: var(--bg2);
  overflow-x: auto;
}
.sekme-btn {
  padding: 8px 18px; border: none; background: transparent;
  color: var(--mut); font-size: 13px; font-weight: 500; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: all 0.15s; font-family: var(--font); white-space: nowrap;
}
.sekme-btn:hover { color: var(--txt); }
.sekme-btn.aktif { color: var(--blu); border-bottom-color: var(--blu); }

/* ── LAYOUT ─────────────────────────────────────────────────────────────── */
.icerik { padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
.sekme-panel { display: none; }
.sekme-panel.aktif { display: block; }

/* ── FİLTRE PANEL ───────────────────────────────────────────────────────── */
.filtre-panel {
  background: var(--bg2);
  border: 1px solid var(--brd);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 14px;
}
.filtre-satirlar { display: flex; flex-direction: column; gap: 10px; }
.filtre-sat { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filtre-sat label { font-size: 11px; color: var(--mut); white-space: nowrap; }
select, input[type="text"], input[type="number"] {
  background: var(--bg3); border: 1px solid var(--brd2); border-radius: 8px;
  color: var(--txt); font-size: 12px; padding: 6px 10px;
  font-family: var(--font); outline: none;
  transition: border-color 0.15s;
}
select:focus, input:focus { border-color: var(--blu); }
select { cursor: pointer; }
.arama-input {
  flex: 1; min-width: 200px;
  padding: 8px 14px; font-size: 13px;
}

/* ── MIN DEĞİŞİM BUTONLARI ──────────────────────────────────────────────── */
.degisim-butonlar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.deg-btn {
  padding: 5px 12px; border-radius: 20px; border: 1px solid var(--brd2);
  background: transparent; color: var(--mut2); font-size: 11px;
  cursor: pointer; font-family: var(--font); transition: all 0.15s;
  white-space: nowrap;
}
.deg-btn:hover { border-color: var(--blu); color: var(--blu); }
.deg-btn.aktif { background: var(--blu); color: #fff; border-color: var(--blu); }

/* ── ÖZET KARTLAR ───────────────────────────────────────────────────────── */
.ozet-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px; margin-bottom: 14px;
}
.ozet-kart {
  background: var(--kart); border: 1px solid var(--brd);
  border-radius: var(--radius); padding: 14px 16px;
  transition: all 0.2s;
}
.ozet-kart:hover { border-color: var(--brd2); transform: translateY(-1px); }
.ozet-v { font-size: 24px; font-weight: 300; line-height: 1; }
.ozet-v.grn { color: var(--grn); }
.ozet-v.red { color: var(--red); }
.ozet-v.blu { color: var(--blu); }
.ozet-v.ora { color: var(--ora); }
.ozet-l { font-size: 10px; color: var(--mut); text-transform: uppercase; letter-spacing: 0.07em; margin-top: 5px; }

/* ── İLAN LİSTESİ ───────────────────────────────────────────────────────── */
.liste-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; gap: 10px; flex-wrap: wrap;
}
.liste-bilgi { font-size: 12px; color: var(--mut2); }
#liste { }
.ilan-kart {
  background: var(--kart); border: 1px solid var(--brd);
  border-radius: var(--radius); padding: 14px 16px;
  margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start;
  transition: all 0.15s; cursor: pointer; position: relative;
}
.ilan-kart:hover { border-color: var(--brd2); background: #1a2640; }
.ilan-kart.fiyat-dustu { border-left: 3px solid var(--grn); }
.ilan-kart.fiyat-artti { border-left: 3px solid var(--red); }
.kaynak-badge {
  flex-shrink: 0; font-size: 10px; font-weight: 700; color: #fff;
  padding: 2px 6px; border-radius: 4px; margin-top: 2px;
}
.kaynak-badge.shb { background: #FF6B00; }
.kaynak-badge.arb { background: #E31837; }
.kaynak-badge.ltg { background: #8b5cf6; }
.ilan-icerik { flex: 1; min-width: 0; }
.ilan-baslik {
  font-size: 13px; font-weight: 500; color: var(--txt);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}
.ilan-meta { display: flex; gap: 10px; flex-wrap: wrap; }
.ilan-meta span { font-size: 11px; color: var(--mut2); }
.ilan-meta .kasa { background: rgba(99,102,241,0.12); color: #818cf8; padding: 1px 6px; border-radius: 4px; }
.ilan-sag { text-align: right; flex-shrink: 0; }
.ilan-fiyat { font-size: 15px; font-weight: 700; }
.ilan-degisim { font-size: 11px; margin-top: 3px; }
.ilan-degisim.dustu { color: var(--grn); }
.ilan-degisim.artti { color: var(--red); }
.ilan-link {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 6px;
  background: rgba(59,130,246,0.1); color: var(--blu);
  text-decoration: none; font-size: 14px; flex-shrink: 0;
  transition: all 0.15s; margin-top: 2px;
}
.ilan-link:hover { background: var(--blu); color: #fff; }
.takip-btn {
  position: absolute; top: 10px; right: 44px;
  background: none; border: none; cursor: pointer;
  font-size: 14px; color: var(--mut); transition: all 0.15s; padding: 4px;
}
.takip-btn:hover, .takip-btn.aktif { color: var(--yel); }

/* ── GEÇMİŞ GRAFİK ─────────────────────────────────────────────────────── */
.gecmis-panel {
  margin-top: 8px; padding-top: 10px;
  border-top: 1px solid var(--brd); display: none;
}
.gecmis-panel.acik { display: block; }
.gecmis-sat {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.03);
}
.gecmis-tarih { color: var(--mut); }
.gecmis-fiyat { font-weight: 600; }

/* ── DAHA FAZLA ─────────────────────────────────────────────────────────── */
#daha-fazla-btn {
  width: 100%; padding: 12px; margin-top: 8px;
  background: var(--bg2); border: 1px solid var(--brd); border-radius: var(--radius);
  color: var(--mut2); font-size: 13px; cursor: pointer; font-family: var(--font);
  transition: all 0.15s;
}
#daha-fazla-btn:hover { background: var(--bg3); color: var(--txt); }

/* ── YÜKLEME EKRANI ─────────────────────────────────────────────────────── */
#yukleme-ekrani {
  position: fixed; inset: 0; background: var(--bg); z-index: 200;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px;
}
.yukleme-logo { font-size: 48px; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.05);opacity:0.8} }
.yukleme-baslik { font-size: 22px; font-weight: 700; color: var(--ora); }
.yukleme-alt { font-size: 13px; color: var(--mut); }
.yukleme-bar-wrap { width: 280px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
.yukleme-bar { height: 100%; background: var(--blu); border-radius: 4px; transition: width 0.3s; }
.yukleme-sayi { font-size: 12px; color: var(--mut2); }

/* ── BOŞ DURUM ──────────────────────────────────────────────────────────── */
.bos { text-align: center; padding: 60px 20px; }
.bos-ikon { font-size: 48px; margin-bottom: 12px; }
.bos-yazi { font-size: 15px; color: var(--mut2); }

/* ── ANALİZ ─────────────────────────────────────────────────────────────── */
.analiz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.analiz-kart {
  background: var(--kart); border: 1px solid var(--brd);
  border-radius: var(--radius); padding: 16px; overflow: hidden;
}
.analiz-baslik { font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; }

/* ── BENZER BUL ─────────────────────────────────────────────────────────── */
.benzer-form {
  background: var(--bg2); border: 1px solid var(--brd);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
}
.benzer-satirlar { display: flex; flex-direction: column; gap: 10px; }
.benzer-sat { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.benzer-sat label { font-size: 11px; color: var(--mut); min-width: 80px; }
.benzer-input { flex: 1; min-width: 160px; }
.benzer-actions { display: flex; gap: 8px; }
.btn-primary {
  padding: 8px 20px; background: var(--blu); color: #fff;
  border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: var(--font); transition: all 0.15s;
}
.btn-primary:hover { background: var(--blu2); }
.btn-secondary {
  padding: 8px 16px; background: transparent; color: var(--mut2);
  border: 1px solid var(--brd2); border-radius: 8px; font-size: 13px;
  cursor: pointer; font-family: var(--font); transition: all 0.15s;
}
.btn-secondary:hover { color: var(--txt); border-color: var(--brd2); }

/* ── TOAST ──────────────────────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--bg3); border: 1px solid var(--brd2);
  border-radius: 10px; padding: 10px 20px; font-size: 13px;
  z-index: 999; opacity: 0; transition: opacity 0.3s;
  pointer-events: none; white-space: nowrap;
}
#toast.gorunu { opacity: 1; }

/* ── SCROLL ─────────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

/* ── MOBİL ──────────────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  .header { padding: 0 12px; gap: 10px; }
  .header-stats { gap: 10px; }
  .hstat-v { font-size: 14px; }
  .icerik { padding: 12px; }
  .ozet-grid { grid-template-columns: repeat(2, 1fr); }
  .ozet-v { font-size: 20px; }
}

/* ── ANIMASYON ──────────────────────────────────────────────────────────── */
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.ilan-kart { animation: fadeIn 0.2s ease both; }
</style>
</head>
<body>

<!-- YÜKLEME EKRANI -->
<div id="yukleme-ekrani">
  <div class="yukleme-logo">🚗</div>
  <div class="yukleme-baslik">ARAÇRADAR</div>
  <div class="yukleme-bar-wrap"><div class="yukleme-bar" id="yukleme-bar" style="width:0%"></div></div>
  <div class="yukleme-sayi" id="yukleme-sayi">Veriler yükleniyor...</div>
  <div class="yukleme-alt">tasiyicihesap.github.io/aracradar</div>
</div>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <span class="logo-icon">🚗</span>
    <div>
      <div class="logo-text">ARAÇRADAR</div>
      <div class="logo-sub">Araç Fiyat Takip</div>
    </div>
  </div>
  <div class="header-divider"></div>
  <div class="header-stats">
    <div class="hstat">
      <div class="hstat-v" id="st-toplam">—</div>
      <div class="hstat-l">İlan</div>
    </div>
    <div class="hstat">
      <div class="hstat-v green" id="st-dustu">—</div>
      <div class="hstat-l">Fiyat Düştü</div>
    </div>
    <div class="hstat">
      <div class="hstat-v red" id="st-artti">—</div>
      <div class="hstat-l">Fiyat Arttı</div>
    </div>
  </div>
  <div class="header-right">
    <span id="son-sync" style="font-size:10px;color:var(--mut)"></span>
    <button class="hbtn" id="btn-bildirim-web" onclick="bildirimTikla(this)">🔔 Bildirim</button>
    <button class="hbtn" onclick="ghVeriYukle(true)">↻ Yenile</button>
  </div>
</header>

<!-- SEKMELER -->
<div class="sekmeler">
  <button class="sekme-btn aktif" data-sekme="degisim">⚡ Değişenler</button>
  <button class="sekme-btn" data-sekme="liste">📋 Tüm İlanlar</button>
  <button class="sekme-btn" data-sekme="takip">⭐ Takip Listem</button>
  <button class="sekme-btn" data-sekme="analiz">📊 Analiz</button>
  <button class="sekme-btn" data-sekme="benzer">🔍 Benzer Bul</button>
</div>

<!-- İÇERİK -->
<div class="icerik">

  <!-- DEĞİŞENLER SEKMESİ -->
  <div class="sekme-panel aktif" id="panel-degisim">
    <!-- Özet kartlar -->
    <div class="ozet-grid" style="margin-bottom:14px">
      <div class="ozet-kart" style="cursor:pointer" onclick="setDegFlt('')">
        <div class="ozet-v" id="oz-toplam">—</div>
        <div class="ozet-l">Tüm Değişimler</div>
      </div>
      <div class="ozet-kart" style="cursor:pointer;border-color:rgba(16,185,129,0.2)" onclick="setDegFlt('dustu')">
        <div class="ozet-v grn" id="oz-dustu">—</div>
        <div class="ozet-l">Fiyat Düştü</div>
      </div>
      <div class="ozet-kart" style="cursor:pointer;border-color:rgba(239,68,68,0.2)" onclick="setDegFlt('artti')">
        <div class="ozet-v red" id="oz-artti">—</div>
        <div class="ozet-l">Fiyat Arttı</div>
      </div>
      <div class="ozet-kart">
        <div class="ozet-v ora" id="oz-ort-dusus">—</div>
        <div class="ozet-l">Ort. Düşüş</div>
      </div>
    </div>

    <!-- Filtreler -->
    <div class="filtre-panel">
      <div class="filtre-satirlar">
        <!-- Min değişim butonları -->
        <div class="filtre-sat">
          <label>Min Değişim:</label>
          <div class="degisim-butonlar">
            <button class="deg-btn" data-val="0" onclick="setMinDeg(0,this)">Hepsi</button>
            <button class="deg-btn" data-val="5000" onclick="setMinDeg(5000,this)">5 bin ₺</button>
            <button class="deg-btn" data-val="10000" onclick="setMinDeg(10000,this)">10 bin ₺</button>
            <button class="deg-btn aktif" data-val="15000" onclick="setMinDeg(15000,this)">15 bin ₺</button>
            <button class="deg-btn" data-val="30000" onclick="setMinDeg(30000,this)">30 bin ₺</button>
            <button class="deg-btn" data-val="50000" onclick="setMinDeg(50000,this)">50 bin ₺</button>
            <button class="deg-btn" data-val="100000" onclick="setMinDeg(100000,this)">100 bin ₺</button>
          </div>
        </div>
        <!-- Diğer filtreler -->
        <div class="filtre-sat">

          <input type="text" class="arama-input" id="f-ara" placeholder="Marka, model, ilan ara..." oninput="goster()">
          <select id="f-kaynak" onchange="goster()">

            <option value="arabam">Arabam</option>
            <option value="letgo">Letgo</option>
          </select>
          <select id="f-marka" onchange="goster()">
            <option value="">Tüm Markalar</option>
          </select>
          <select id="f-kasa" onchange="goster()">
            <option value="">Tüm Kasalar</option>
          </select>
        </div>
        <div class="filtre-sat">
          <label>Fiyat:</label>
          <input type="number" id="f-min" placeholder="Min ₺" style="width:110px" oninput="goster()">
          <input type="number" id="f-max" placeholder="Max ₺" style="width:110px" oninput="goster()">
          <label style="margin-left:10px">Yıl:</label>
          <input type="number" id="f-yil-min" placeholder="Min" style="width:80px" oninput="goster()">
          <input type="number" id="f-yil-max" placeholder="Max" style="width:80px" oninput="goster()">
          <select id="f-srt" onchange="goster()" style="margin-left:auto">
            <option value="tarih-desc">↓ En yeni</option>
            <option value="dusus-desc">↓ En çok düşen</option>
            <option value="dusus-pct">↓ % En çok düşen</option>
            <option value="fiyat-asc">↑ En ucuz</option>
            <option value="fiyat-desc">↓ En pahalı</option>
          </select>
        </div>
      </div>
    </div>

    <div class="liste-header">
      <div class="liste-bilgi" id="liste-bilgi"></div>
    </div>
    <div id="liste"></div>
    <button id="daha-fazla-btn" style="display:none" onclick="sayfaAc()"></button>
  </div>

  <!-- TÜM İLANLAR -->
  <div class="sekme-panel" id="panel-liste">
    <div class="filtre-panel">
      <div class="filtre-satirlar">
        <div class="filtre-sat">
          <input type="text" class="arama-input" id="f2-ara" placeholder="Ara..." oninput="goster2()">
          <select id="f2-kaynak" onchange="goster2()">
            <option value="">Tüm Siteler</option>
            <option value="sahibinden">Sahibinden</option>
            <option value="arabam">Arabam</option>
            <option value="letgo">Letgo</option>
          </select>
          <select id="f2-marka" onchange="goster2()">
            <option value="">Tüm Markalar</option>
          </select>
        </div>
        <div class="filtre-sat">
          <label>Fiyat:</label>
          <input type="number" id="f2-min" placeholder="Min ₺" style="width:110px" oninput="goster2()">
          <input type="number" id="f2-max" placeholder="Max ₺" style="width:110px" oninput="goster2()">
          <label style="margin-left:10px">Yıl:</label>
          <input type="number" id="f2-yil-min" placeholder="Min" style="width:80px" oninput="goster2()">
          <input type="number" id="f2-yil-max" placeholder="Max" style="width:80px" oninput="goster2()">
          <select id="f2-srt" onchange="goster2()" style="margin-left:auto">
            <option value="tarih-desc">↓ En yeni</option>
            <option value="fiyat-asc">↑ En ucuz</option>
            <option value="fiyat-desc">↓ En pahalı</option>
            <option value="km-asc">↑ En az km</option>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// ARAÇRADAR WEB — Yeni Arayüz
// ═══════════════════════════════════════════════════════════════════════════

var GH_RAW  = 'https://raw.githubusercontent.com/tasiyicihesap/aracradar/main';
var veri    = [];
var _aktifSekme = 'degisim';
var _minDegisim = 15000;
var _degFltVal  = '';
var _takipSet   = {};
var _offset     = 0;
var _offset2    = 0;
var SAYFA_BOY   = 50;
var _kasaDB     = null;
var _swReg      = null;

// ── Service Worker ──────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js')
      .then(function(r){ _swReg = r; })
      .catch(function(){});
  });
}

// ── Chrome storage shim ─────────────────────────────────────────────────────
var chrome = window.chrome || {};
if (!chrome.storage) {
  chrome.storage = {
    local: {
      get: function(keys, cb) {
        var r = {};
        var ks = typeof keys==='string'?[keys]:(Array.isArray(keys)?keys:Object.keys(keys||{}));
        ks.forEach(function(k){ try{ var v=localStorage.getItem(k); r[k]=v?JSON.parse(v):undefined; }catch(e){} });
        cb && cb(r);
      },
      set: function(obj, cb) {
        Object.keys(obj).forEach(function(k){ try{ localStorage.setItem(k,JSON.stringify(obj[k])); }catch(e){} });
        cb && cb();
      }
    }
  };
}

// ── Takip yükleme ───────────────────────────────────────────────────────────
function takipYukle() {
  try {
    var t = JSON.parse(localStorage.getItem('ar_takip') || '{}');
    _takipSet = t;
  } catch(e) { _takipSet = {}; }
}

function takipToggle(id) {
  if (_takipSet[id]) delete _takipSet[id];
  else _takipSet[id] = Date.now();
  try { localStorage.setItem('ar_takip', JSON.stringify(_takipSet)); } catch(e) {}
  goster();
  if (_aktifSekme === 'takip') gosterTakip();
}

// ── GitHub veri çekme ────────────────────────────────────────────────────────
function ghVeriYukle(zorla) {
  var bar = document.getElementById('yukleme-bar');
  var sayi = document.getElementById('yukleme-sayi');
  var yukleme = document.getElementById('yukleme-ekrani');

  // iOS ve diğer tarayıcılar için güvenli cache kontrolü
  if (!zorla) {
    try {
      var meta = JSON.parse(localStorage.getItem('ar_gh_meta')||'null');
      if (meta && (Date.now()-meta.ts) < 10*60*1000) {
        // IndexedDB olmadan localStorage'dan kontrol
        var cachedStr = localStorage.getItem('ar_veri_mini');
        if (cachedStr) {
          try {
            var cached = JSON.parse(cachedStr);
            if (cached && cached.length > 0) {
              veri = cached;
              if (yukleme) yukleme.style.display = 'none';
              veriUygula();
              return;
            }
          } catch(e2) {}
        }
      }
    } catch(e) {}
  }
  _ghFetch(bar, sayi, yukleme);
}

function _ghFetch(bar, sayi, yukleme) {
  if (yukleme) yukleme.style.display = 'flex';
  fetch(GH_RAW + '/data/meta.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(meta) {
      var parcalar = meta.parcalar || [];
      var tumIlanlar = [];
      var tamamlanan = 0;
      var toplam = meta.toplam || 0;
      if (!parcalar.length) { if(yukleme) yukleme.style.display='none'; return; }

      parcalar.forEach(function(yol) {
        var fname = yol.split('/').pop();
        fetch(GH_RAW + '/data/' + fname + '?t=' + Date.now())
          .then(function(r){ return r.json(); })
          .then(function(p) {
            tumIlanlar = tumIlanlar.concat(p);
            tamamlanan++;
            var pct = Math.round(tamamlanan/parcalar.length*100);
            if (bar) bar.style.width = pct + '%';
            if (sayi) sayi.textContent = tumIlanlar.length.toLocaleString('tr-TR') + ' / ' + toplam.toLocaleString('tr-TR') + ' ilan yüklendi';
            if (tamamlanan === parcalar.length) {
              veri = tumIlanlar;
              // Cache'e yaz — iOS uyumlu (localStorage)
              try {
                localStorage.setItem('ar_gh_meta', JSON.stringify({ts:Date.now(), toplam:toplam}));
                // Büyük veriyi localStorage'a yazmayı dene (iOS sınırı ~5MB)
                // Sadece meta kaydet, veriyi her seferinde fetch et
              } catch(e){}
              if (yukleme) yukleme.style.display = 'none';
              veriUygula();
              // Fiyat değişimi bildirim kontrolü
              setTimeout(function(){ fiyatBildirimKontrol(); }, 1500);
            }
          })
          .catch(function() {
            tamamlanan++;
            if (tamamlanan===parcalar.length) { if(yukleme) yukleme.style.display='none'; veriUygula(); }
          });
      });
    })
    .catch(function(e) {
      if (sayi) sayi.textContent = 'Hata: ' + e.message;
    });
}

function veriUygula() {
  // Dropdown'ları doldur
  markaDropdownDoldur();
  kasaDropdownDoldur();
  // Stats
  hesaplaStats();
  // İlanları göster
  goster();
  // Kasa DB yükle
  kasaDBYukle();
}

function hesaplaStats() {
  var simdi = Date.now();
  var kk = 48*3600*1000; // 48 saat
  var dustu = 0, artti = 0, topDusus = 0, dususSay = 0;
  veri.forEach(function(il) {
    var g = Array.isArray(il.gecmis) ? il.gecmis : [];
    if (g.length < 2) return;
    var son = il.guncelleme ? new Date(il.guncelleme).getTime() : 0;
    if ((simdi-son) > kk) return;
    var f1 = parseInt(g[g.length-1].fiyat)||0;
    var f2 = parseInt(g[g.length-2].fiyat)||0;
    if (!f1||!f2||f1===f2) return;
    if (f1 < f2) { dustu++; topDusus += (f2-f1); dususSay++; }
    else artti++;
  });
  var el = function(id,v){ var e=document.getElementById(id); if(e) e.textContent=v; };
  el('st-toplam', veri.length.toLocaleString('tr-TR'));
  el('st-dustu', dustu.toLocaleString('tr-TR'));
  el('st-artti', artti.toLocaleString('tr-TR'));
  el('oz-toplam', (dustu+artti).toLocaleString('tr-TR'));
  el('oz-dustu', dustu.toLocaleString('tr-TR'));
  el('oz-artti', artti.toLocaleString('tr-TR'));
  el('oz-ort-dusus', dususSay ? (Math.round(topDusus/dususSay)).toLocaleString('tr-TR')+'₺' : '—');
  document.getElementById('son-sync').textContent = 'Güncellendi: ' + new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}

// ── Filtreleme ───────────────────────────────────────────────────────────────
function filtrele(liste) {
  var ara     = (document.getElementById('f-ara')||{}).value||'';
  var kaynak  = (document.getElementById('f-kaynak')||{}).value||'';
  var marka   = (document.getElementById('f-marka')||{}).value||'';
  var kasa    = (document.getElementById('f-kasa')||{}).value||'';
  var minF    = parseInt((document.getElementById('f-min')||{}).value)||0;
  var maxF    = parseInt((document.getElementById('f-max')||{}).value)||0;
  var yilMin  = parseInt((document.getElementById('f-yil-min')||{}).value)||0;
  var yilMax  = parseInt((document.getElementById('f-yil-max')||{}).value)||0;

  return liste.filter(function(il) {
    if (kaynak && (il.kaynak||'sahibinden') !== kaynak) return false;
    if (marka  && (il.marka||'').toLowerCase() !== marka.toLowerCase()) return false;
    if (kasa   && (il.kasa||'').toLowerCase().indexOf(kasa.toLowerCase())===-1) return false;
    var f = il.fiyat || 0;
    if (minF && f && f < minF) return false;
    if (maxF && f && f > maxF) return false;
    if (yilMin && il.yil && il.yil < yilMin) return false;
    if (yilMax && il.yil && il.yil > yilMax) return false;
    if (ara) {
      var s = ara.toLowerCase();
      var hay = (il.ad||'')+(il.marka||'')+(il.seri||'')+(il.model||'')+(il.kasa||'');
      if (hay.toLowerCase().indexOf(s)===-1) return false;
    }
    // Yayından kalkmış Letgo ilanları
    if (il.url && il.url.includes('redirectedItem=true')) return false;
    return true;
  });
}

// ── Değişenler ───────────────────────────────────────────────────────────────
function setMinDeg(val, btn) {
  _minDegisim = val;
  document.querySelectorAll('.deg-btn').forEach(function(b){ b.classList.remove('aktif'); });
  if (btn) btn.classList.add('aktif');
  _offset = 0;
  goster();
}

function setDegFlt(val) {
  _degFltVal = val;
  _offset = 0;
  goster();
}

function goster() {
  var simdi = Date.now();
  var kk = 48*3600*1000;
  var srt = (document.getElementById('f-srt')||{}).value || 'tarih-desc';

  var liste = filtrele(veri).filter(function(il) {
    var g = Array.isArray(il.gecmis) ? il.gecmis : [];
    if (g.length < 2) return false;
    var son = il.guncelleme ? new Date(il.guncelleme).getTime() : 0;
    if ((simdi-son) > kk) return false;
    var f1 = parseInt(g[g.length-1].fiyat)||0;
    var f2 = parseInt(g[g.length-2].fiyat)||0;
    if (!f1||!f2||f1===f2) return false;
    var fark = f2-f1; // pozitif = düştü
    if (_minDegisim && Math.abs(fark) < _minDegisim) return false;
    if (_degFltVal==='dustu' && fark <= 0) return false;
    if (_degFltVal==='artti' && fark >= 0) return false;
    return true;
  }).map(function(il) {
    var g = il.gecmis;
    var f1 = parseInt(g[g.length-1].fiyat)||0;
    var f2 = parseInt(g[g.length-2].fiyat)||0;
    var fark = f2-f1;
    return Object.assign({}, il, {_fark: fark, _f1: f1, _f2: f2});
  });

  // Sıralama
  liste.sort(function(a,b) {
    if (srt==='dusus-desc') return b._fark - a._fark;
    if (srt==='dusus-pct') return (b._fark/b._f2) - (a._fark/a._f2);
    if (srt==='fiyat-asc') return (a._f1||0)-(b._f1||0);
    if (srt==='fiyat-desc') return (b._f1||0)-(a._f1||0);
    // tarih-desc default
    var ta = a.guncelleme ? new Date(a.guncelleme).getTime() : 0;
    var tb = b.guncelleme ? new Date(b.guncelleme).getTime() : 0;
    return tb-ta;
  });

  var bilgi = document.getElementById('liste-bilgi');
  if (bilgi) bilgi.textContent = liste.length.toLocaleString('tr-TR') + ' değişim bulundu';

  var el = document.getElementById('liste');
  if (!el) return;

  var goster_liste = liste.slice(0, _offset + SAYFA_BOY);
  el.innerHTML = goster_liste.length ? goster_liste.map(function(il,i){
    return ilanKartHTML(il, true, i);
  }).join('') : '<div class="bos"><div class="bos-ikon">🔍</div><div class="bos-yazi">Bu kriterde değişim bulunamadı</div></div>';

  var dfb = document.getElementById('daha-fazla-btn');
  if (dfb) {
    if (liste.length > _offset + SAYFA_BOY) {
      dfb.style.display = 'block';
      dfb.textContent = '↓ Daha fazla göster (' + (liste.length - _offset - SAYFA_BOY).toLocaleString('tr-TR') + ' ilan daha)';
    } else { dfb.style.display = 'none'; }
  }
}

function sayfaAc() { _offset += SAYFA_BOY; goster(); }

// ── Tüm ilanlar ─────────────────────────────────────────────────────────────
function goster2() {
  var ara    = (document.getElementById('f2-ara')||{}).value||'';
  var kaynak = (document.getElementById('f2-kaynak')||{}).value||'';
  var marka  = (document.getElementById('f2-marka')||{}).value||'';
  var minF   = parseInt((document.getElementById('f2-min')||{}).value)||0;
  var maxF   = parseInt((document.getElementById('f2-max')||{}).value)||0;
  var yilMin = parseInt((document.getElementById('f2-yil-min')||{}).value)||0;
  var yilMax = parseInt((document.getElementById('f2-yil-max')||{}).value)||0;
  var srt    = (document.getElementById('f2-srt')||{}).value||'tarih-desc';

  var liste = veri.filter(function(il) {
    if (kaynak && (il.kaynak||'sahibinden')!==kaynak) return false;
    if (marka && (il.marka||'').toLowerCase()!==marka.toLowerCase()) return false;
    var f = il.fiyat||0;
    if (minF && f && f<minF) return false;
    if (maxF && f && f>maxF) return false;
    if (yilMin && il.yil && il.yil<yilMin) return false;
    if (yilMax && il.yil && il.yil>yilMax) return false;
    if (ara) {
      var s=ara.toLowerCase();
      if (((il.ad||'')+(il.marka||'')+(il.seri||'')+(il.model||'')).toLowerCase().indexOf(s)===-1) return false;
    }
    return true;
  });

  liste.sort(function(a,b) {
    if (srt==='fiyat-asc') return (a.fiyat||0)-(b.fiyat||0);
    if (srt==='fiyat-desc') return (b.fiyat||0)-(a.fiyat||0);
    if (srt==='km-asc') return (parseInt(a.km)||0)-(parseInt(b.km)||0);
    var ta=a.guncelleme?new Date(a.guncelleme).getTime():0;
    var tb=b.guncelleme?new Date(b.guncelleme).getTime():0;
    return tb-ta;
  });

  var bilgi = document.getElementById('liste2-bilgi');
  if (bilgi) bilgi.textContent = liste.length.toLocaleString('tr-TR') + ' ilan';

  var el = document.getElementById('liste2');
  if (!el) return;
  var g2 = liste.slice(0, _offset2 + SAYFA_BOY);
  el.innerHTML = g2.length ? g2.map(function(il,i){ return ilanKartHTML(il,false,i); }).join('') : '<div class="bos"><div class="bos-ikon">🔍</div><div class="bos-yazi">İlan bulunamadı</div></div>';

  var dfb2 = document.getElementById('daha-fazla2-btn');
  if (dfb2) {
    if (liste.length > _offset2+SAYFA_BOY) {
      dfb2.style.display='block';
      dfb2.textContent='↓ Daha fazla ('+(liste.length-_offset2-SAYFA_BOY).toLocaleString('tr-TR')+' ilan)';
    } else dfb2.style.display='none';
  }
}
function sayfaAc2() { _offset2+=SAYFA_BOY; goster2(); }

// ── Takip listesi ────────────────────────────────────────────────────────────
function gosterTakip() {
  var el = document.getElementById('liste-takip');
  if (!el) return;
  var takipIlanlar = veri.filter(function(il){ return !!_takipSet[il.id]; });
  el.innerHTML = takipIlanlar.length
    ? takipIlanlar.map(function(il,i){ return ilanKartHTML(il,false,i); }).join('')
    : '<div class="bos"><div class="bos-ikon">⭐</div><div class="bos-yazi">Henüz takip listenizde ilan yok.<br><small>İlan kartındaki ⭐ butonuna basın</small></div></div>';
}

// ── İlan kartı HTML ──────────────────────────────────────────────────────────
function ilanKartHTML(il, showDeg, animIdx) {
  var kaynakKls = il.kaynak==='arabam'?'arb':il.kaynak==='letgo'?'ltg':'shb';
  var kaynakAd  = il.kaynak==='arabam'?'ARB':il.kaynak==='letgo'?'LTG':'SHB';
  var ad = (il.ad || (il.marka+' '+(il.seri||il.model||''))).substring(0,90);
  var fiyat = (il.fiyat||il._f1||0).toLocaleString('tr-TR') + ' ₺';
  var km = il.km ? parseInt(il.km).toLocaleString('tr-TR')+' km' : '';
  var yilKm = [il.yil>1990?il.yil:'',km].filter(Boolean).join(' · ');
  var kasa = il.kasa ? '<span class="kasa">'+il.kasa+'</span>' : '';
  var takipAktif = _takipSet[il.id] ? 'aktif' : '';
  var kls = '';
  var degHtml = '';

  if (showDeg && il._fark !== undefined) {
    var farkAbs = Math.abs(il._fark).toLocaleString('tr-TR');
    var pct = Math.round(Math.abs(il._fark)/il._f2*100);
    if (il._fark > 0) {
      kls = 'fiyat-dustu';
      degHtml = '<div class="ilan-degisim dustu">▼ '+farkAbs+' ₺ (%'+pct+')</div>';
    } else {
      kls = 'fiyat-artti';
      degHtml = '<div class="ilan-degisim artti">▲ '+farkAbs+' ₺ (%'+pct+')</div>';
    }
  }

  var delay = Math.min(animIdx*0.02, 0.5);
  return '<div class="ilan-kart '+kls+'" style="animation-delay:'+delay+'s" onclick="kartTikla(event,this,\''+il.id+'\')">'
    + '<button class="takip-btn '+takipAktif+'" onclick="event.stopPropagation();takipToggle(\''+il.id+'\')">⭐</button>'
    + '<span class="kaynak-badge '+kaynakKls+'">'+kaynakAd+'</span>'
    + '<div class="ilan-icerik">'
    + '<div class="ilan-baslik">'+ad+'</div>'
    + '<div class="ilan-meta"><span>'+yilKm+'</span>'+kasa+'</div>'
    + '</div>'
    + '<div class="ilan-sag">'
    + '<div class="ilan-fiyat">'+fiyat+'</div>'
    + degHtml
    + '</div>'
    + '<a href="'+il.url+'" target="_blank" class="ilan-link" onclick="event.stopPropagation()">↗</a>'
    + '</div>';
}

function kartTikla(e, el, id) {
  // Fiyat geçmişini göster/gizle
  var mevcut = el.querySelector('.gecmis-panel');
  if (mevcut) { mevcut.classList.toggle('acik'); return; }
  var il = veri.find(function(i){ return i.id===id; });
  if (!il||!il.gecmis||!il.gecmis.length) return;
  var g = Array.isArray(il.gecmis)?il.gecmis:[];
  var html = '<div class="gecmis-panel acik">'
    + '<div style="font-size:10px;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">Fiyat Geçmişi</div>'
    + g.slice().reverse().map(function(r){
      var t = r.tarih ? new Date(r.tarih).toLocaleDateString('tr-TR') : '—';
      return '<div class="gecmis-sat"><span class="gecmis-tarih">'+t+'</span><span class="gecmis-fiyat">'+(parseInt(r.fiyat)||0).toLocaleString('tr-TR')+' ₺</span></div>';
    }).join('')
    + '</div>';
  el.insertAdjacentHTML('beforeend', html);
}

// ── Dropdown doldur ──────────────────────────────────────────────────────────
function markaDropdownDoldur() {
  var markalar = {};
  veri.forEach(function(il){ if(il.marka) markalar[il.marka]=true; });
  var liste = Object.keys(markalar).sort();
  ['f-marka','f2-marka'].forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var sec = el.value;
    el.innerHTML = '<option value="">Tüm Markalar</option>';

    if (sec) el.value = sec;

}

// ── Bildirim ─────────────────────────────────────────────────────────────────
function bildirimTikla(btn) {
  if (!('Notification' in window)) { flash('Bu tarayıcı bildirim desteklemiyor'); return; }
  if (Notification.permission==='granted') {
    var sesiz = localStorage.getItem('ar_sesiz')==='1';
    localStorage.setItem('ar_sesiz', sesiz?'0':'1');
    bildirimBtnGuncelle();
    if (sesiz) bildirimGonder({baslik:'🔔 ARAÇRADAR',mesaj:'Bildirimler açıldı!'});
    return;
  }
  if (Notification.permission==='denied') { flash('Tarayıcı ayarlarından bildirimlere izin verin'); return; }
  Notification.requestPermission().then(function(p){
    bildirimBtnGuncelle();
    if (p==='granted') setTimeout(function(){ bildirimGonder({baslik:'🔔 ARAÇRADAR',mesaj:'Fiyat değişimlerinde bildirim alacaksınız!'}); },400);
  });
}

function bildirimBtnGuncelle() {
  var btn = document.getElementById('btn-bildirim-web');
  if (!btn) return;
  var sesiz = localStorage.getItem('ar_sesiz')==='1';
  if (Notification.permission==='granted' && !sesiz) {
    btn.textContent='🔔 Açık'; btn.classList.add('on'); btn.classList.remove('sesiz');
  } else if (Notification.permission==='granted' && sesiz) {
    btn.textContent='🔕 Sessiz'; btn.classList.add('sesiz'); btn.classList.remove('on');
  } else { btn.textContent='🔔 Bildirim'; btn.classList.remove('on','sesiz'); }
}

function bildirimGonder(data) {
  if (Notification.permission!=='granted') return;
  if (localStorage.getItem('ar_sesiz')==='1' && data.id!=='test') return;
  if (_swReg && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({type:'FIYAT_BILDIRIMI',baslik:data.baslik,mesaj:data.mesaj,url:data.url||'./',id:'ar-'+Date.now()});
  } else {
    navigator.serviceWorker.ready.then(function(r){
      r.showNotification(data.baslik,{body:data.mesaj,icon:'./icon192.svg',tag:'ar-'+Date.now(),vibrate:[200,100,200]});
    }).catch(function(){
      try{ new Notification(data.baslik,{body:data.mesaj}); }catch(e){}
    });
  }
}

function fiyatBildirimKontrol() {
  if (Notification.permission!=='granted') return;
  var onceki = {};
  try{ onceki=JSON.parse(localStorage.getItem('ar_son_fiyatlar')||'{}'); }catch(e){}
  var takip = _takipSet;
  var degisimler = [];
  var yeniF = {};
  veri.forEach(function(il) {
    if (!il||!il.id) return;
    var g = Array.isArray(il.gecmis)?il.gecmis:[];
    var f = il.fiyat||(g.length?parseInt(g[g.length-1].fiyat)||0:0);
    if (!f) return;
    yeniF[il.id]=f;
    var eski = onceki[il.id];
    if (!eski||eski===f) return;
    var fark=eski-f; var pct=Math.round(Math.abs(fark)/eski*100);
    var takipte=!!takip[il.id];
    if (!takipte && pct<3) return;
    degisimler.push({il:il,f:f,eski:eski,fark:fark,pct:pct,takipte:takipte});
  });
  Object.assign(onceki,yeniF);
  try{localStorage.setItem('ar_son_fiyatlar',JSON.stringify(onceki));}catch(e){}
  if (!degisimler.length||!Object.keys(onceki).length) return;
  degisimler.sort(function(a,b){return Math.abs(b.pct)-Math.abs(a.pct);});
  degisimler.slice(0,3).forEach(function(d){
    bildirimGonder({
      baslik:(d.fark>0?'📉':'📈')+(d.takipte?' ⭐ ':' ')+'ARAÇRADAR',
      mesaj:(d.il.ad||'Araç').substring(0,60)+'\n'+(d.fark>0?'▼':'▲')+' '+Math.abs(d.fark).toLocaleString('tr-TR')+'₺ (%'+d.pct+') → '+d.f.toLocaleString('tr-TR')+'₺',
      url: './'
    });
  });
}

// ── Benzer Bul ───────────────────────────────────────────────────────────────
function benzerLinkCek() {
  var url = (document.getElementById('bz-link')||{}).value||'';
  if (!url) return;
  var durum = document.getElementById('bz-durum');
  if (durum) durum.textContent = 'Link analiz ediliyor...';
  // URL'den bilgileri parse et
  try {
    var u = new URL(url);
    var path = u.pathname;
    // Sahibinden: /honda-civic/...
    // Arabam: /ikinci-el/honda-civic-1-6/...
    var parts = path.split('/').filter(Boolean);
    if (parts.length > 0) {
      var slug = parts[parts.length-1] || parts[0];
      var words = slug.replace(/[-_]/g,' ').split(' ');
      if (words.length > 0 && document.getElementById('bz-marka')) {
        document.getElementById('bz-marka').value = words[0].charAt(0).toUpperCase()+words[0].slice(1);
      }
      if (words.length > 1 && document.getElementById('bz-model')) {
        document.getElementById('bz-model').value = words[1].charAt(0).toUpperCase()+words[1].slice(1);
      }
    }
    if (durum) durum.textContent = 'Link alındı — kriterleri düzenleyip DB\'den Ara\'ya basın';
  } catch(e) {
    if (durum) durum.textContent = 'Geçersiz URL';
  }
}

function benzerAraDB() {
  var marka  = (document.getElementById('bz-marka')||{}).value||'';
  var model  = (document.getElementById('bz-model')||{}).value||'';
  var vites  = (document.getElementById('bz-vites')||{}).value||'';
  var yakit  = (document.getElementById('bz-yakit')||{}).value||'';
  var yilMin = parseInt((document.getElementById('bz-yil-min')||{}).value)||0;
  var yilMax = parseInt((document.getElementById('bz-yil-max')||{}).value)||0;
  var kmMin  = parseInt((document.getElementById('bz-km-min')||{}).value)||0;
  var kmMax  = parseInt((document.getElementById('bz-km-max')||{}).value)||0;
  var refF   = parseInt((document.getElementById('bz-ref-fiyat')||{}).value)||0;
  var durum  = document.getElementById('bz-durum');

  if (!marka && !model) { flash('En az marka veya model girin'); return; }
  if (durum) durum.textContent = 'Aranıyor...';

  var sonuc = veri.filter(function(il) {
    if (marka && (il.marka||'').toLowerCase().indexOf(marka.toLowerCase())===-1) return false;
    if (model) {
      var m = model.toLowerCase();
      if (((il.seri||'')+(il.model||'')).toLowerCase().indexOf(m)===-1) return false;
    }
    if (yilMin && il.yil && il.yil<yilMin) return false;
    if (yilMax && il.yil && il.yil>yilMax) return false;
    if (vites && (il.vites||'').indexOf(vites)===-1) return false;
    if (yakit && (il.yakit||'').indexOf(yakit)===-1) return false;
    var km=parseInt(il.km)||0;
    if (kmMin && km && km<kmMin) return false;
    if (kmMax && km && km>kmMax) return false;
    var f=il.fiyat||0;
    if (refF) { if(f<refF*0.4||f>refF*2) return false; }
    return true;
  }).map(function(il) {
    var f=il.fiyat||0;
    return Object.assign({},il,{fiyat:f});
  }).filter(function(il){ return il.fiyat>0&&il.url; });

  sonuc.sort(function(a,b){return a.fiyat-b.fiyat;});

  if (durum) durum.textContent = '✅ '+sonuc.length+' ilan bulundu';

  var wrap = document.getElementById('bz-sonuc-wrap');
  if (!wrap) return;
  wrap.style.display='block';

  var refFiyat = refF || 0;
  var ucuzlar  = refFiyat ? sonuc.filter(function(il){return il.fiyat<refFiyat;}) : [];
  var pahalilar= refFiyat ? sonuc.filter(function(il){return il.fiyat>=refFiyat;}) : sonuc;

  function kartHtml(il) {
    var fark='', farkCls='';
    if (refFiyat&&il.fiyat) {
      var f=il.fiyat-refFiyat; var pct=Math.round(Math.abs(f)/refFiyat*100);
      fark=(f<0?'▼ ':'▲ ')+Math.abs(f).toLocaleString('tr-TR')+'₺ (%'+pct+')';
      farkCls=f<0?'dustu':'artti';
    }
    var kaynakKls=il.kaynak==='arabam'?'arb':il.kaynak==='letgo'?'ltg':'shb';
    var kaynakAd=il.kaynak==='arabam'?'ARB':il.kaynak==='letgo'?'LTG':'SHB';
    return '<div class="ilan-kart" style="margin-bottom:6px">'
      +'<span class="kaynak-badge '+kaynakKls+'">'+kaynakAd+'</span>'
      +'<div class="ilan-icerik">'
      +'<div class="ilan-baslik">'+(il.ad||(il.marka+' '+(il.seri||il.model||''))).substring(0,80)+'</div>'
      +'<div class="ilan-meta"><span>'+[il.yil>1990?il.yil:'',il.km?parseInt(il.km).toLocaleString('tr-TR')+' km':''].filter(Boolean).join(' · ')+'</span>'+(il.kasa?'<span class="kasa">'+il.kasa+'</span>':'')+'</div>'
      +'</div>'
      +'<div class="ilan-sag"><div class="ilan-fiyat">'+il.fiyat.toLocaleString('tr-TR')+' ₺</div>'+(fark?'<div class="ilan-degisim '+farkCls+'">'+fark+'</div>':'')+'</div>'
      +'<a href="'+il.url+'" target="_blank" class="ilan-link" onclick="event.stopPropagation()">↗</a>'
      +'</div>';
  }

  var html = '';
  if (refFiyat && ucuzlar.length) {
    html += '<div style="font-size:12px;font-weight:600;color:var(--grn);padding:10px 0 6px">↓ DAHA UCUZ — '+ucuzlar.length+' ilan</div>';
    html += ucuzlar.slice(0,10).map(kartHtml).join('');
  }
  if (pahalilar.length) {
    html += '<div style="font-size:12px;font-weight:600;color:var(--red);padding:10px 0 6px">'+(refFiyat?'↑ DAHA PAHALI':'TÜM SONUÇLAR')+' — '+pahalilar.length+' ilan</div>';
    html += pahalilar.slice(0,10).map(kartHtml).join('');
  }
  if (!html) html='<div class="bos"><div class="bos-ikon">🔍</div><div class="bos-yazi">Eşleşen ilan bulunamadı</div></div>';
  wrap.innerHTML = html;
}

// ── Analiz ───────────────────────────────────────────────────────────────────
function gosterAnaliz() {
  var el = document.getElementById('analiz-icerik');
  if (!el||!veri.length) return;

  // Marka dağılımı
  var markaSay={}, kaynakSay={sahibinden:0,arabam:0,letgo:0};
  var fiyatlar=[]; var yillar={};
  veri.forEach(function(il){
    if(il.marka) markaSay[il.marka]=(markaSay[il.marka]||0)+1;
    if(il.kaynak) kaynakSay[il.kaynak]=(kaynakSay[il.kaynak]||0)+1;
    if(il.fiyat>0) fiyatlar.push(il.fiyat);
    if(il.yil>1990) yillar[il.yil]=(yillar[il.yil]||0)+1;
  });

  var topMarkalar = Object.entries(markaSay).sort(function(a,b){return b[1]-a[1];}).slice(0,10);
  var ortFiyat = fiyatlar.length ? Math.round(fiyatlar.reduce(function(a,b){return a+b;},0)/fiyatlar.length) : 0;
  var minFiyat = fiyatlar.length ? Math.min.apply(null,fiyatlar) : 0;
  var maxFiyat = fiyatlar.length ? Math.max.apply(null,fiyatlar) : 0;

  el.innerHTML = '<div class="analiz-grid">'
    // Kaynak dağılımı
    +'<div class="analiz-kart"><div class="analiz-baslik">Kaynak Dağılımı</div>'
    +Object.entries(kaynakSay).map(function(e){
      var top=veri.length?Math.round(e[1]/veri.length*100):0;
      var renk=e[0]==='arabam'?'#E31837':e[0]==='letgo'?'#8b5cf6':'#FF6B00';
      return '<div style="margin-bottom:10px">'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:'+renk+';font-weight:600">'+e[0].charAt(0).toUpperCase()+e[0].slice(1)+'</span><span style="color:var(--mut2)">'+e[1].toLocaleString('tr-TR')+' ('+top+'%)</span></div>'
        +'<div style="height:6px;background:rgba(255,255,255,0.06);border-radius:3px"><div style="height:100%;width:'+top+'%;background:'+renk+';border-radius:3px"></div></div>'
        +'</div>';
    }).join('')+'</div>'
    // Fiyat istatistikleri
    +'<div class="analiz-kart"><div class="analiz-baslik">Fiyat İstatistikleri</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
    +[['Ortalama',ortFiyat],['En Ucuz',minFiyat],['En Pahalı',maxFiyat],['Toplam',veri.length]].map(function(s){
      return '<div style="background:var(--bg3);border-radius:8px;padding:12px">'
        +'<div style="font-size:18px;font-weight:300;color:var(--blu)">'+(typeof s[1]==='number'&&s[0]!=='Toplam'?s[1].toLocaleString('tr-TR')+' ₺':s[1].toLocaleString('tr-TR'))+'</div>'
        +'<div style="font-size:10px;color:var(--mut);margin-top:3px;text-transform:uppercase;letter-spacing:.06em">'+s[0]+'</div>'
        +'</div>';
    }).join('')+'</div></div>'
    // Top markalar
    +'<div class="analiz-kart"><div class="analiz-baslik">En Çok İlan — Top 10 Marka</div>'
    +topMarkalar.map(function(e,i){
      var pct=veri.length?Math.round(e[1]/veri.length*100):0;
      return '<div style="margin-bottom:8px">'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>'+(i+1)+'. '+e[0]+'</span><span style="color:var(--mut2)">'+e[1].toLocaleString('tr-TR')+'</span></div>'
        +'<div style="height:4px;background:rgba(255,255,255,0.06);border-radius:2px"><div style="height:100%;width:'+pct+'%;background:var(--blu);border-radius:2px"></div></div>'
        +'</div>';
    }).join('')+'</div>'
    +'</div>';
}

function flash(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('gorunu');
  clearTimeout(window._flashTimer);
  window._flashTimer = setTimeout(function(){ el.classList.remove('gorunu'); }, 3000);
}
